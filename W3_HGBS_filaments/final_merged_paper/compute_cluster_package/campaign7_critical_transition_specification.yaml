# ========================================================================
# CRITICAL TRANSITION CAMPAIGN SPECIFICATION
# Target: Referee Major Concern 2 (Regime Mismatch) & Moderate Concern 9
# Purpose: Map λ/W vs f in the critical transition regime f=0.9-1.3
# ========================================================================
#
# Scientific Rationale:
# ---------------------
# The referee correctly identifies that if HGBS filaments are near-critical
# (f_eff ≈ 0.71 with asymmetric uncertainty +0.47/-0.31), then the
# near-critical simulation results (λ/W ≈ 3.0-3.2) are DIRECTLY relevant
# to observations, and the factor-of-1.4 discrepancy narrows further.
#
# This campaign maps the transition from sub-critical (no fragmentation)
# through near-critical (λ/W ≈ 3) to supercritical (radial collapse).
# The λ/W(f) relationship will constrain which regime HGBS filaments occupy.
#
# ========================================================================

campaign_name: CRITICAL_TRANSITION
campaign_id: C7_CRITICAL_TRANSITION
date: 2026-04-30
referee_concern: "Major Concern 2: Regime Mismatch + Moderate Concern 9: β-dependence"

# ========================================================================
# SIMULATION PARAMETERS
# ========================================================================

# Field geometry: Longitudinal (θ=0°) for direct comparison with Apr2026
field_geometry: 0  # degrees, 0 = longitudinal

# Domain: Standard 8λ_J × 2λ_J × 2λ_J with periodic BCs
domain:
  Lx: 8.0  # in units of λ_J
  Ly: 2.0
  Lz: 2.0
  boundary_conditions: periodic

# Resolution: Standard 128³ (32 cells/λ_J)
resolution: 128

# Equation of state: Isothermal (γ = 1)
eos: isothermal
gamma: 1.0

# Output: High-cadence HDF5 snapshots for λ/W extraction
output:
  hdf5_dt: 0.05  # in units of t_J
  tlim: 2.5      # in units of t_J
  full_dump: true

# ========================================================================
# PARAMETER GRID
# ========================================================================

# Mass-to-flux ratio f: Fine sampling in critical transition
f_values: [0.9, 0.95, 1.0, 1.05, 1.1, 1.15, 1.2, 1.25, 1.3]

# Plasma beta: Sample the range that spans observed λ/W
beta_values: [0.3, 0.5, 1.0, 1.5, 2.0]

# Mach number: Quiescent (to isolate f and β dependence)
mach: 1.0

# Random seeds: 3 per parameter point for statistics
seeds: [42, 137, 314]

# ========================================================================
# TOTAL SIMULATIONS
# ========================================================================
# N_f = 9 values
# N_beta = 5 values
# N_seeds = 3
# TOTAL = 9 × 5 × 3 = 135 simulations
# ========================================================================

# Expected outcomes by regime:
# ----------------------------
# f < 1.0: STABLE (no fragmentation expected)
# f = 1.0-1.1: FRAG, near-critical regime (λ/W measurement target)
# f = 1.15-1.25: FRAG, transition regime (λ/W may vary with f)
# f ≥ 1.3: FRAG or RADIAL COLLAPSE (supercritical regime)

# ========================================================================
# COMPUTATIONAL REQUIREMENTS
# ========================================================================

# Per-simulation resources
np_per_sim: 8
walltime_per_sim_hours: 4
memory_per_sim_gb: 16

# Cluster deployment
total_cores: 200
parallel_sims: 25  # 200 cores / 8 cores per sim
estimated_walltime_days: 1  # 135 sims / 25 parallel = 5.4 batches ≈ 22 hours

# ========================================================================
# ANALYSIS REQUIREMENTS
# ========================================================================

analysis_script: measure_lambda_W.py
output_metrics:
  - lambda_W: "Fragmentation wavelength in units of W"
  - t_frag: "Fragmentation time in units of t_J"
  - n_peaks: "Number of fragmentation peaks"
  - quality_flag: "GOOD, FEW_PEAKS, or NO_PEAKS"
  - radial_collapse_time: "Time to radial collapse (if applicable)"

# Key scientific products:
# ------------------------
# 1. λ/W vs f curve for each β value (5 curves)
# 2. Critical f threshold where fragmentation begins
# 3. f dependence of λ/W in near-critical regime
# 4. β dependence of λ/W across the critical transition

# ========================================================================
# ATHENA++ CONFIGURATION FILE TEMPLATE
# ========================================================================

athena_config:
  job:
    problem_id: "C7_critical_transition"
    tlim: 2.5
    dt: 1.0e-3

  mesh:
    nx1: 128
    nx2: 32
    nx3: 32
    mesh_block: [32, 32, 32]
    bc_ix1: periodic
    bc_ox1: periodic
    bc_ix2: periodic
    bc_ox2: periodic
    bc_ix3: periodic
    bc_ox3: periodic

  hydro:
    iso_sound_speed: 1.0
    gamma: 1.0

  magnetic:
    beta: ${BETA}  # Will be set per simulation
    bx1: 0.0
    bx2: 0.0
    bx3: ${B0}  # Will be set to achieve desired beta

  gravity:
    grav_axis_type: cylinder
    cyl_axis: 1
    cyl_radius: 0.0
    cyl_mass_to_flux: ${F}  # Will be set per simulation

  output:
    filetype: hdf5
    dt: 0.05
    variables: [dens, mom1, mom2, mom3, B1, B2, B3]

# ========================================================================
# FILE NAMING CONVENTION
# ========================================================================

naming_pattern: "C7_TRANS_f{F}_b{BETA}_s{SEED}"
example: "C7_TRANS_f1.05_b1.0_s137"

# ========================================================================
# QUALITY CONTROL
# ========================================================================

validation_tests:
  - resolution_convergence: "Compare subset at 256³ resolution"
  - timeout_check: "Flag runs reaching 6-hour wall limit"
  - radial_collapse_detection: "Identify runs with t_collapse < t_frag"
  - lambda_w_measurability: "Flag runs with n_peaks < 3 or n_peaks > 50"

success_criteria:
  min_fragmentation_rate: 0.60  # At least 60% of near-critical runs should fragment
  max_failure_rate: 0.05        # Fewer than 5% numerical failures
